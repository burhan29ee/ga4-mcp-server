[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ga4-mcp-server"
version = "0.1.0"
description = "A Google Analytics 4 MCP server with read AND write access: reports, realtime, custom dimensions/metrics, key events, audiences, and Measurement Protocol."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Malik Burhan" }]
keywords = ["mcp", "model-context-protocol", "google-analytics", "ga4", "analytics", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.2,<2",
  "google-analytics-data>=0.18",
  "google-analytics-admin>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ga4-mcp-server = "ga4_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/burhan29ee/ga4-mcp-server"
Repository = "https://github.com/burhan29ee/ga4-mcp-server"
Issues = "https://github.com/burhan29ee/ga4-mcp-server/issues"
Changelog = "https://github.com/burhan29ee/ga4-mcp-server/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ga4_mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
